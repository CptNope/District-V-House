<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Hanken Grotesk",system-ui,sans-serif}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:24px;background:var(--glass,#0D2A24)}
.row.gold{background:var(--leaf,#DDB65C)}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:16px;line-height:1;padding:15px 22px;border-radius:var(--radius-md,3px);border:1.5px solid var(--leaf,#DDB65C)}
.btn svg{width:18px;height:18px}
.gilt{background:var(--leaf,#DDB65C);color:var(--sash,#06110E);box-shadow:var(--shadow-button,0 6px 14px -8px rgb(0 0 0/.55))}
.line{background:transparent;color:var(--frost,#EFF3F0)}
.dark{background:var(--sash,#06110E);color:var(--leaf,#DDB65C);border-color:var(--sash,#06110E)}
</style></head><body>
<div class="row">
<a class="btn gilt" href="#"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9.5" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Get directions</a>
<a class="btn line" href="#"><svg viewBox="0 0 24 24"><path d="M6.6 3.5h2.6l1.4 4.1-2 1.4a12 12 0 0 0 6.4 6.4l1.4-2 4.1 1.4v2.6a2 2 0 0 1-2.2 2A16.6 16.6 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2Z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>(774) 314-0022</a>
</div>
<div class="row gold"><a class="btn dark" href="#"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>Get directions</a></div>
</body></html>
