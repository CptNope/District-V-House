<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--frost,#EFF3F0);font-family:"Hanken Grotesk",system-ui,sans-serif;padding:28px 24px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:16px 12px}
li{position:relative;padding:8px 16px 8px 30px;font-weight:600;font-size:15px;color:var(--sash,#06110E);
background:color-mix(in oklab,var(--leaf,#DDB65C) 30%,var(--frost,#EFF3F0));border:1px solid color-mix(in oklab,var(--shade,#6B4A16) 55%,transparent);
clip-path:polygon(14px 0,100% 0,100% 100%,14px 100%,0 50%)}
li::before{content:"";position:absolute;left:13px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--frost,#EFF3F0);box-shadow:inset 0 0 0 1.5px var(--shade,#6B4A16)}
li:nth-child(3n+2){transform:rotate(-2deg) translateY(2px)}li:nth-child(4n+3){transform:rotate(1.6deg)}
</style></head><body>
<ul><li>Antique</li><li>Vintage</li><li>Old &amp; new</li><li>Handmade</li><li>Artisan</li><li>Furniture</li><li>Birch Alley</li></ul>
</body></html>
